# Walks the local fixture shop. Start it first (see README quickstart):
#   python -m http.server 8000 --directory tests/fixtures/shop/ok
name: Demo shop checkout
base_url: http://127.0.0.1:8000
timeout_ms: 3000
steps:
  - goto: /
  - expect_text:
      selector: h1
      text: Demo Shop
  - click: "text=Blue Mug"
  - expect_text:
      selector: "#product-title"
      text: Blue Mug
  - click: "#add-to-cart"
  - expect_text:
      selector: h1
      text: Your cart
  - screenshot: cart
  - expect_visible: "#checkout-button"
  - click: "#checkout-button"
  - fill:
      selector: "#email"
      value: test@example.com
  - expect_visible: "#payment-step"
  - screenshot: checkout
